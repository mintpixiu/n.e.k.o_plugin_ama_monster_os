[plugin]
id = "ama_monster_os"
name = "N.E.K.O Ama Monster OS"
description = "《N.E.K.O Ama Monster OS》0.1.0 Beta：给 N.E.K.O 的猫娘风格系统壳窗口，带实时状态、联网搜索、Steam 价格与历史最低价、Steam 国区当前价（CNY）、Steam 促销精选、免费即玩、促销日历、系统桥契约，以及为未来独立软件预留的内置系统接口。搜索优先调用 N.E.K.O 的 web_search 插件，并在其未运行时使用固定 Bing RSS 回退；Steam 全球价格与促销日程来自 CheapShark 与 Steamworks 官方快照（USD），国区当前价来自 Steam 官方商店 API（CNY）。只发送查询文字，不自动抓取网页；不收集 Steam 密码。当前版本是可运行的窗口预览，不冒充完整操作系统。"
short_description = "A NEKO-styled OS shell window with live status, web search, Steam price history, sale picks, free-to-play shelf, sale calendar (USD), and a versioned system-bridge seam."
keywords = [
    "ama monster os",
    "ama os",
    "monster os",
    "neko os",
    "系统壳",
    "桌面壳",
    "插件窗口",
    "系统窗口",
    "联网",
    "网络搜索",
    "搜索网页",
    "internet",
    "web search",
    "steam",
    "steam 价格",
    "steam 国区",
    "国区价格",
    "中文名",
    "游戏中文名",
    "人民币",
    "cny",
    "历史最低价",
    "游戏价格",
    "steam 促销",
    "steam 特卖",
    "促销推荐",
    "值得入手",
    "免费即玩",
    "免费游戏",
    "促销日历",
    "store price",
    "price history",
    "sale picks",
    "free to play",
    "sale calendar",
    "shell preview",
    "system bridge",
]
version = "0.1.0-beta"
type = "plugin"
entry = "plugin.plugins.ama_monster_os:AmaMonsterOsPlugin"

[plugin.author]
name = "mintpixiu"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "en"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "os_shell"
title = "Ama Monster OS"
entry = "ui/panel.tsx"
context = "os_shell"
permissions = [
    "state:read",
    "action:call",
]

[[plugin.ui.guide]]
id = "quickstart"
title = "Ama Monster OS 快速开始"
entry = "docs/quickstart.md"
permissions = [
    "state:read",
]

[[plugin.ui.docs]]
id = "system_contract"
title = "System Bridge v1"
entry = "docs/system-contract.md"
permissions = [
    "state:read",
]

[plugin_runtime]
enabled = true
auto_start = false
timeout = 15
startup_failure = "warn"
