[plugin]
id = "ama_monster_os"
name = "N.E.K.O Ama Monster OS"
description = "《N.E.K.O Ama Monster OS》0.5.3 Beta：给 N.E.K.O 的猫娘风格系统壳窗口，带实时状态、联网搜索、Steam 价格与历史最低价、Steam 国区当前价（CNY）、Steam 促销精选（按批次轮换）、免费即玩（按组轮换）、促销日历、Steam OpenID 登录（支持 Steam++ 加速检测）、Token 看板（国内外主流模型公开目录价、30 日 K 线、峰谷时段）、用户自定义 UI 外观（玻璃 / 金属 / 卡通奶油 / 彩水墨 / 实心五种材质）与导入导出、最多 30 色渐变、Steam 风格选取音效与自定义音效、系统桥契约，以及为未来独立软件预留的内置系统接口。搜索优先调用 N.E.K.O 的 web_search 插件，并在其未运行时使用固定 Bing RSS 回退；Steam 全球价格与促销日程来自 CheapShark 与 Steamworks 官方快照（USD），国区当前价来自 Steam 官方商店 API（CNY）；Token 目录价来自 models.dev 公开目录（USD/1M tokens），DeepSeek 峰谷规则来自官方文档。只发送查询文字，不自动抓取网页；不收集 Steam 密码。当前版本是可运行的窗口预览，不冒充完整操作系统。"
short_description = "A NEKO-styled OS shell with live status, web search, Steam prices and sale calendar, a token price radar with 30-day candles and peak/off-peak windows, a customizable UI studio, and a versioned system-bridge seam."
keywords = [
    "ama monster os",
    "ama os",
    "monster os",
    "neko os",
    "系统壳",
    "桌面壳",
    "插件窗口",
    "系统窗口",
    "联网",
    "网络搜索",
    "搜索网页",
    "internet",
    "web search",
    "steam",
    "steam 价格",
    "steam 国区",
    "国区价格",
    "中文名",
    "游戏中文名",
    "人民币",
    "cny",
    "历史最低价",
    "游戏价格",
    "steam 促销",
    "steam 特卖",
    "steam 登录",
    "steam++",
    "openid",
    "促销推荐",
    "值得入手",
    "免费即玩",
    "免费游戏",
    "促销日历",
    "自定义ui",
    "ui界面",
    "主题",
    "导入导出",
    "外观",
    "窗口背景",
    "背景图片",
    "导入图片",
    "颜色渐变",
    "选取音效",
    "自定义音效",
    "Token 看板",
    "模型价格",
    "K 线",
    "教程",
    "store price",
    "price history",
    "sale picks",
    "free to play",
    "sale calendar",
    "shell preview",
    "system bridge",
]
version = "0.5.3-beta"
type = "plugin"
entry = "plugin.plugins.ama_monster_os:AmaMonsterOsPlugin"

[plugin.author]
name = "呆萌貔貅"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "en"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "os_shell"
title = "Ama Monster OS"
entry = "ui/panel.tsx"
context = "os_shell"
permissions = [
    "state:read",
    "action:call",
]

[[plugin.ui.guide]]
id = "quickstart"
title = "Ama Monster OS 快速开始"
entry = "docs/quickstart.md"
permissions = [
    "state:read",
]

[[plugin.ui.guide]]
id = "ui_studio"
title = "自定义外观与导入导出教程"
entry = "docs/ui-studio.md"
permissions = [
    "state:read",
]

[[plugin.ui.guide]]
id = "token_radar"
title = "Token 看板与价格时段说明"
entry = "docs/token-radar.md"
permissions = [
    "state:read",
]

[[plugin.ui.docs]]
id = "system_contract"
title = "System Bridge v1"
entry = "docs/system-contract.md"
permissions = [
    "state:read",
]

[plugin_runtime]
enabled = true
auto_start = false
timeout = 15
startup_failure = "warn"
